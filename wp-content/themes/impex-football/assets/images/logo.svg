<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Football (soccer ball) graphic -->
  <circle cx="50" cy="50" r="44" fill="url(#ballGrad)" stroke="#222" stroke-width="2"/>

  <!-- Pentagon patches -->
  <polygon points="50,28 62,37 58,51 42,51 38,37" fill="#1a1a1a" stroke="#fff" stroke-width="0.8"/>
  <polygon points="22,30 35,25 38,37 28,44 18,38" fill="#1a1a1a" stroke="#fff" stroke-width="0.8"/>
  <polygon points="78,30 65,25 62,37 72,44 82,38" fill="#1a1a1a" stroke="#fff" stroke-width="0.8"/>
  <polygon points="20,62 30,56 42,51 40,65 28,70" fill="#1a1a1a" stroke="#fff" stroke-width="0.8"/>
  <polygon points="80,62 70,56 58,51 60,65 72,70" fill="#1a1a1a" stroke="#fff" stroke-width="0.8"/>
  <polygon points="40,65 60,65 62,77 50,82 38,77" fill="#1a1a1a" stroke="#fff" stroke-width="0.8"/>

  <!-- Ball outline -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#333" stroke-width="2"/>

  <!-- IMPEX Text -->
  <text x="108" y="45" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" fill="url(#goldGrad)" letter-spacing="3">IMPEX</text>

  <!-- Tagline -->
  <text x="110" y="65" font-family="Arial, sans-serif" font-weight="400" font-size="11" fill="#cccccc" letter-spacing="4">FOOTBALL MANUFACTURER</text>

  <!-- Gold underline accent -->
  <rect x="108" y="70" width="200" height="3" rx="1.5" fill="url(#goldGrad)"/>
</svg>
