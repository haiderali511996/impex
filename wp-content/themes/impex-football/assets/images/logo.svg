<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Background -->
  <rect width="300" height="100" fill="transparent"/>

  <!-- Football Icon -->
  <g transform="translate(10, 10)">
    <!-- Main circle -->
    <circle cx="40" cy="40" r="38" fill="#0a0a0a" stroke="#FFD700" stroke-width="2.5"/>

    <!-- Pentagon center -->
    <polygon points="40,18 54,28 49,44 31,44 26,28" fill="#FFD700" stroke="#0a0a0a" stroke-width="1.5"/>

    <!-- Surrounding pentagons (partial, football pattern) -->
    <polygon points="40,18 54,28 62,16 52,6 28,6" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <polygon points="54,28 49,44 63,50 72,38 62,16" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <polygon points="49,44 31,44 27,58 40,64 53,58" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <polygon points="31,44 26,28 12,22 8,38 17,50" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <polygon points="26,28 40,18 28,6 14,10 12,22" fill="none" stroke="#FFD700" stroke-width="1.5"/>

    <!-- Outer circle border -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="#FFD700" stroke-width="2.5"/>
  </g>

  <!-- IMPEX Text -->
  <text x="105" y="48" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="4">IMPEX</text>

  <!-- Tagline -->
  <text x="106" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#FFD700" letter-spacing="6">FOOTBALL CO.</text>

  <!-- Gold accent line -->
  <line x1="105" y1="75" x2="285" y2="75" stroke="#FFD700" stroke-width="1.5"/>
</svg>
